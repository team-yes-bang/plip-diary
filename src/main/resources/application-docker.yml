server:
  port: ${SERVER_PORT:8081}

spring:
  mongodb:
    uri: mongodb://${MONGO_HOST:mongo}:${MONGO_PORT:27017}/${MONGO_DATABASE:plip_diary_read}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:plip_diary}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

eureka:
  instance:
    prefer-ip-address: false
    hostname: diary
  client:
    enabled: false
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
