openapi: 3.1.0
info:
  title: Diary Service API
  description: plip-diary REST API
  version: v1.0.0
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: Theme
  description: 다이어리 테마 API
paths:
  /api/diaries/themes:
    get:
      tags:
      - Theme
      summary: 테마 목록 조회
      description: 사용자의 활성 테마 목록 반환
      operationId: listThemes
      parameters:
      - name: X-User-Uuid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ThemeListResponse"
    post:
      tags:
      - Theme
      summary: 테마 생성
      description: 활성 테마는 사용자당 최대 5개까지 생성 가능
      operationId: createTheme
      parameters:
      - name: X-User-Uuid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateThemeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ThemeResponse"
  /api/diaries/themes/{themeId}:
    get:
      tags:
      - Theme
      summary: 테마 메타 단건 조회
      description: "테마 이름·생성일 등 **메타 정보만** 반환. 테마에 포함된 영상 목록은 `GET /api/diaries/themes/{themeId}/timeline`\
        \ (Phase 4-3) 사용."
      operationId: getTheme
      parameters:
      - name: X-User-Uuid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: themeId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ThemeResponse"
    delete:
      tags:
      - Theme
      summary: 테마 삭제
      description: 테마와 연관 영상을 Soft Delete 처리
      operationId: deleteTheme
      parameters:
      - name: X-User-Uuid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: themeId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
    patch:
      tags:
      - Theme
      summary: 테마 이름 수정
      operationId: updateTheme
      parameters:
      - name: X-User-Uuid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: themeId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateThemeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ThemeResponse"
components:
  schemas:
    CreateThemeRequest:
      type: object
      description: 테마 생성 요청
      properties:
        name:
          type: string
          description: 테마 이름
          example: 여행
          maxLength: 50
          minLength: 0
      required:
      - name
    ThemeResponse:
      type: object
      description: 테마 응답
      properties:
        themeId:
          type: integer
          format: int64
          description: 테마 ID
          example: 1
        name:
          type: string
          description: 테마 이름
          example: 일상
        createdAt:
          type: string
          format: date-time
          description: 생성 시각
        updatedAt:
          type: string
          format: date-time
          description: 수정 시각
    UpdateThemeRequest:
      type: object
      description: 테마 수정 요청
      properties:
        name:
          type: string
          description: 테마 이름
          example: 여행 기록
          maxLength: 50
          minLength: 0
      required:
      - name
    ThemeListResponse:
      type: object
      description: 테마 목록 응답
      properties:
        themes:
          type: array
          description: 활성 테마 목록
          items:
            $ref: "#/components/schemas/ThemeResponse"
